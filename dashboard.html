<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accessibility Dashboard</title>
  <script src="dashboard.js" defer></script>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">

</head>
<body class="bg-gray-100 p-6">
  <h1 class="text-2xl font-bold text-center text-blue-600">Accessibility Settings Dashboard</h1>

  <!-- Speech Controls Section -->
  <div class="mt-6 p-4 bg-white shadow-md rounded-md">
    <h2 class="text-lg font-semibold">Speech Controls</h2>
    <label class="block mt-4">
      <span class="text-gray-700">Select Voice</span>
      <select id="voiceSelect" class="mt-2 block w-full border border-gray-300 rounded-md">
        <option>Default</option>
        <option>Female Voice</option>
        <option>Male Voice</option>
      </select>
    </label>
    <div class="mt-4">
      <label class="block text-gray-700">Adjust Speech Rate</label>
      <input id="speechRate" type="range" min="0.5" max="2" step="0.1" value="1" class="mt-2 w-full">
    </div>
  </div>

  <!-- Gesture & Eye Tracking Section -->
  <div class="mt-6 p-4 bg-white shadow-md rounded-md">
    <h2 class="text-lg font-semibold">Gesture & Eye Tracking</h2>
    <button id="calibrateGestures" class="mt-4 w-full bg-purple-500 text-white py-2 rounded-md">
      Calibrate Gestures
    </button>
    <button id="calibrateEye" class="mt-4 w-full bg-red-500 text-white py-2 rounded-md">
      Calibrate Eye Tracking
    </button>
  </div>

  <!-- Shortcut Commands Section -->
  <div class="mt-6 p-4 bg-white shadow-md rounded-md">
    <h2 class="text-lg font-semibold">Shortcut Commands</h2>
    <ul class="list-disc list-inside mt-2 text-gray-700">
      <li>Say "Start" to enable STT.</li>
      <li>Say "Stop" to disable STT.</li>
      <li>Use gestures to scroll or navigate.</li>
    </ul>
  </div>

  <!-- Back to Popup Button -->
  <div class="text-center mt-6">
    <a href="popup.html" class="text-blue-500 hover:underline">Back to Popup</a>
  </div>
</body>
</html>
